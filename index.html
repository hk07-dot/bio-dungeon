<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology Dungeon: The Living Realm</title>
<!-- Firebase (free tier) powers the live class PIN, leaderboard and dashboard. See SETUP.md -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14111c; --panel:#211b2e; --panel2:#2b2340; --line:#3d3358;
  --gold:#e8b84a; --gold2:#f6d98a; --text:#ece6f5; --muted:#a79bbf;
  --good:#4fc98a; --bad:#e45b5b; --blue:#5aa8e8; --xp:#a77bf0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;}
body{background:radial-gradient(ellipse at top,#2a1f3d 0%,var(--bg) 60%) fixed;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:56px 14px 40px}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
h1{font-size:30px;color:var(--gold);text-align:center;letter-spacing:1px;line-height:1.2}
h2{font-size:21px;color:var(--gold2)}
h3{font-size:16px}
.sub{color:var(--muted);text-align:center;margin:8px 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#2a1d05;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.block{display:block;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.hero{font-size:64px;text-align:center;margin:10px 0}
input[type=text],textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
textarea{font-family:ui-monospace,monospace;font-size:12px;resize:vertical;min-height:64px;word-break:break-all}
.langbar{position:fixed;top:10px;right:10px;z-index:8;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.langbar button{font:inherit;font-weight:800;font-size:13px;border:0;background:transparent;color:var(--muted);padding:7px 12px;cursor:pointer}
.langbar button.on{background:var(--gold);color:#2a1d05}
.cls{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.cls.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,74,.2)}
.cls .ic{font-size:30px}
.cls b{display:block;font-family:Cinzel,serif;margin:4px 0}
.cls small{color:var(--muted);display:block;line-height:1.4}
.bar{height:10px;background:#0e0b14;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;transition:width .4s}
.hpbar>i{background:linear-gradient(90deg,#c43d3d,#ef6b6b)}
.xpbar>i{background:linear-gradient(90deg,#7a52d1,var(--xp))}
.ehp>i{background:linear-gradient(90deg,#9d3fd6,#d36cf0)}
.zbar>i{background:linear-gradient(90deg,#b8862a,var(--gold))}
.stat{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin:6px 0 3px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.formhdr{display:flex;align-items:center;gap:10px;margin:20px 0 10px;color:var(--gold2);font-family:Cinzel,serif}
.formhdr:after{content:"";flex:1;height:1px;background:var(--line)}
.path{position:relative;padding-left:26px}
.path:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.zone{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.zone:before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.zone.open:before{background:var(--gold)} .zone.done:before{background:var(--good)}
.zone.locked{opacity:.45;cursor:not-allowed}
.zone .zi{font-size:30px;width:44px;text-align:center}
.zone .zt{flex:1} .zone .zt small{color:var(--muted);display:block}
.zone .tag{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--panel2);white-space:nowrap}
.zone.open .tag{color:var(--gold)} .zone.done .tag{color:var(--good)}
.enemy{text-align:center}
.enemy .face{line-height:0;margin:4px 0;display:inline-block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.enemy .face svg{width:130px;height:130px}
.ref{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.toast svg{vertical-align:middle;margin-right:4px}
.enemy .face.hit{animation:shake .4s}
.enemy .face.dead{animation:die .6s forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-6deg)}75%{transform:translateX(10px) rotate(6deg)}}
@keyframes die{to{transform:scale(.2) rotate(90deg);opacity:0}}
.boss-tag{display:inline-block;background:#5a1d2e;color:#ffb3c1;font-size:12px;padding:2px 8px;border-radius:8px;font-weight:800;letter-spacing:1px}
.q{font-size:17px;font-weight:600;line-height:1.45;margin:4px 0 14px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{background:#173a2a;border-color:var(--good);opacity:1}
.opt.wrong{background:#3f1a1f;border-color:var(--bad)}
.opt.gone{opacity:.25;text-decoration:line-through}
.result{margin-top:14px;padding:14px;border-radius:12px;background:#17121f;border:1px solid var(--line)}
.dice{display:flex;align-items:center;gap:14px}
.d20{width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:800;font-size:22px;color:#2a1d05;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.d20.roll{animation:spin .6s linear}
.d20.crit{background:#7dffb6} .d20.fail{background:var(--bad);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.good{color:var(--good)} .badc{color:var(--bad)} .goldc{color:var(--gold)}
.expl{margin-top:10px;font-size:14.5px;line-height:1.5;color:#d8cfe8;border-left:3px solid var(--blue);padding-left:10px}
.toast{position:fixed;left:50%;top:54px;transform:translateX(-50%);background:var(--gold);color:#2a1d05;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:9;animation:pop 2.4s forwards;max-width:90vw;text-align:center}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.jitem{border-bottom:1px solid var(--line);padding:12px 0}
.jitem:last-child{border-bottom:0}
.muted{color:var(--muted)}
.center{text-align:center}
.foes{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.foes span{font-size:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line)}
.foes span.now{border-color:var(--gold)} .foes span.down{opacity:.3}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--muted);display:block;font-size:12px}
.kpi b{font-size:22px;font-family:Cinzel,serif;color:var(--gold2)}
.trow{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
@media(max-width:480px){.trow{grid-template-columns:110px 1fr 64px;font-size:13px}}
.trow .bar{height:12px}
.trow .v{text-align:right;color:var(--muted);font-size:12.5px}
.accg>i{background:var(--good)} .acca>i{background:var(--gold)} .accb>i{background:var(--bad)}
.scard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.scard.me{border-color:var(--gold)}
.scard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.scard .nm{font-weight:800}
.scard .real{color:var(--muted);font-size:13px}
.minis{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.minis b{color:var(--text)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots span{flex:1;height:8px;border-radius:4px;background:#0e0b14;border:1px solid var(--line)}
.dots span.d{background:var(--good);border-color:var(--good)}
.note{font-size:14px;line-height:1.5;padding:10px 12px;border-radius:10px;background:#17121f;border:1px solid var(--line);margin-bottom:12px}
.pinbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:linear-gradient(135deg,#3b2a6b,#5a2a5e);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pinbar small{color:var(--muted);font-size:12px}
.pinbar .url{font-size:13px;word-break:break-all;color:var(--text)}
.bigpin{font-family:Cinzel,serif;font-weight:800;font-size:36px;color:var(--gold);letter-spacing:3px;line-height:1.1;white-space:nowrap}
.bigin{font-size:28px !important;text-align:center;letter-spacing:6px;font-weight:800}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--panel2);margin-bottom:6px}
.lrow.me{outline:2px solid var(--gold)}
.lrow .md{width:28px;text-align:center;font-size:20px}
.lrow .rk{font-size:14px;color:var(--muted);font-weight:800}
.lrow .ln{flex:1;font-weight:700}
.lrow .lp{font-weight:800;color:var(--gold2)}
.guide summary{cursor:pointer;font-family:Cinzel,serif;font-weight:800;color:var(--gold2);font-size:16px;list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary:after{content:' ▾';color:var(--muted)}
.guide[open] summary:after{content:' ▴'}
.gtabs{display:flex;gap:6px;margin:12px 0 10px}
.gtabs button{flex:1}
.guide ol{margin:0;padding-left:20px;line-height:1.55;font-size:14.5px}
.guide li{margin-bottom:7px}
.guide .gtip{font-size:13px;color:var(--muted);margin:10px 0 0}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:#3a2f55;color:var(--gold2);font-weight:800;vertical-align:middle}
</style>
</head>

     'Dalam mitosis, kromatid kembar berpisah dan bergerak ke kutub bertentangan semasa…',['Anafasa','Metafasa','Profasa','Sitokinesis'],'Semasa anafasa, sentromer terbahagi dan gentian gelendong menarik kromatid kembar ke kutub bertentangan.'),
   Q('How does cytokinesis happen in plant cells?',['A cell plate forms in the middle of the cell','A cleavage furrow pinches the cell','The nucleus divides into two','The cell wall dissolves completely'],'Plant cells have a rigid cell wall, so vesicles fuse to form a cell plate. Animal cells use a cleavage furrow.',
     'Bagaimanakah sitokinesis berlaku dalam sel tumbuhan?',['Plat sel terbentuk di tengah-tengah sel','Alur pembelahan mencerut sel','Nukleus terbahagi kepada dua','Dinding sel larut sepenuhnya'],'Sel tumbuhan mempunyai dinding sel yang tegar, jadi vesikel bergabung membentuk plat sel. Sel haiwan menggunakan alur pembelahan.'),
   Q('Cancer happens when…',['cells undergo uncontrolled mitosis','cells stop dividing completely','meiosis happens in body cells','chromosomes stop replicating'],'Cancer cells divide by mitosis without control and form a tumour. Mutagens such as radiation and carcinogens can trigger it.',
     'Kanser berlaku apabila…',['sel mengalami mitosis yang tidak terkawal','sel berhenti membahagi sepenuhnya','meiosis berlaku dalam sel soma','kromosom berhenti mereplikasi'],'Sel kanser membahagi secara mitosis tanpa kawalan dan membentuk tumor. Mutagen seperti sinaran dan karsinogen boleh mencetuskannya.')
  ]},
 {id:'lungs', form:4, icon:'🔥', name:['Lungs of Fire','Paru-paru Api'], topic:['Cellular Respiration & Respiratory Systems','Respirasi Sel & Sistem Respirasi'],
  minion:{name:['Carbon Monoxide Wisp','Wap Karbon Monoksida'], icon:'💨'}, boss:{name:['The Anaerobic Wyrm','Naga Anaerob'], icon:'🐲'},
  q:[
   Q('During vigorous exercise, anaerobic respiration in human muscles produces…',['lactic acid','ethanol and carbon dioxide','glucose','oxygen'],'Without enough oxygen, muscle cells break glucose down into lactic acid, releasing a little energy. The build-up of lactic acid causes muscle fatigue.',
     'Semasa senaman cergas, respirasi anaerob dalam otot manusia menghasilkan…',['asid laktik','etanol dan karbon dioksida','glukosa','oksigen'],'Tanpa oksigen yang mencukupi, sel otot mengurai glukosa kepada asid laktik dan membebaskan sedikit tenaga. Pengumpulan asid laktik menyebabkan kelesuan otot.'),
   Q('What is produced when yeast carries out fermentation?',['Ethanol, carbon dioxide and energy','Lactic acid and energy','Oxygen and glucose','Water and carbon dioxide only'],'Yeast fermentation (anaerobic) gives ethanol, CO₂ and a little energy. It is used in making bread and tapai.',
     'Apakah yang dihasilkan apabila yis menjalankan fermentasi?',['Etanol, karbon dioksida dan tenaga','Asid laktik dan tenaga','Oksigen dan glukosa','Air dan karbon dioksida sahaja'],'Fermentasi yis (anaerob) menghasilkan etanol, CO₂ dan sedikit tenaga. Ia digunakan dalam pembuatan roti dan tapai.'),
   Q('Where does gaseous exchange take place in humans?',['Alveoli','Trachea','Bronchus','Larynx'],'Alveoli are thin, moist, numerous and surrounded by blood capillaries, which makes them efficient for gaseous exchange.',
     'Di manakah pertukaran gas berlaku dalam manusia?',['Alveolus','Trakea','Bronkus','Laring'],'Alveolus nipis, lembap, banyak dan diliputi kapilari darah, menjadikannya cekap untuk pertukaran gas.'),
   Q('What happens to the diaphragm during inhalation?',['It contracts and flattens','It relaxes and curves upwards','It does not move','It moves towards the lungs'],'During inhalation the diaphragm contracts and flattens and the external intercostal muscles contract. Thoracic volume rises, pressure falls, and air rushes in.',
     'Apakah yang berlaku kepada diafragma semasa tarikan nafas?',['Mengecut dan mendatar','Mengendur dan melengkung ke atas','Tidak bergerak','Bergerak ke arah peparu'],'Semasa tarikan nafas, diafragma mengecut dan mendatar dan otot interkosta luar mengecut. Isi padu toraks bertambah, tekanan berkurang dan udara masuk.'),
   Q('What is the respiratory structure of an insect such as a grasshopper?',['Tracheal system','Gills','Lungs','Moist skin'],'Insects breathe through spiracles connected to tracheae and tracheoles, which carry air directly to the cells.',
     'Apakah struktur respirasi serangga seperti belalang?',['Sistem trakea','Insang','Peparu','Kulit lembap'],'Serangga bernafas melalui spirakel yang bersambung dengan trakea dan trakeol, yang membawa udara terus ke sel.'),
   Q('What is oxygen debt?',['The oxygen needed to break down lactic acid after vigorous exercise','Oxygen stored in the lungs','Lack of oxygen in fish gills','Oxygen used for photosynthesis'],'After exercise you keep breathing fast to repay the oxygen debt. The extra oxygen oxidises lactic acid.',
     'Apakah hutang oksigen?',['Oksigen yang diperlukan untuk mengurai asid laktik selepas senaman cergas','Oksigen yang disimpan dalam peparu','Kekurangan oksigen dalam insang ikan','Oksigen yang digunakan untuk fotosintesis'],'Selepas bersenam, anda terus bernafas dengan laju untuk membayar hutang oksigen. Oksigen tambahan mengoksidakan asid laktik.'),
   Q('Why is carbon monoxide dangerous?',['It binds to haemoglobin more strongly than oxygen','It dissolves the alveoli','It turns blood into lactic acid','It blocks the trachea physically'],'Carbon monoxide forms stable carboxyhaemoglobin, which lowers the blood\'s ability to carry oxygen.',
     'Mengapakah karbon monoksida berbahaya?',['Ia bergabung dengan hemoglobin lebih kuat daripada oksigen','Ia melarutkan alveolus','Ia menukar darah menjadi asid laktik','Ia menyekat trakea secara fizikal'],'Karbon monoksida membentuk karboksihemoglobin yang stabil, mengurangkan keupayaan darah mengangkut oksigen.')
  ]},
 {id:'blood', form:4, icon:'🩸', name:['Bloodstream Rapids','Jeram Aliran Darah'], topic:['Human Transport & Body Defence','Pengangkutan dalam Manusia & Keimunan'],
  minion:{name:['Pathogen Goblin','Goblin Patogen'], icon:'👺'}, boss:{name:['The Plague Lord','Raja Wabak'], icon:'💀'},
  q:[
   Q('Which blood vessel carries oxygenated blood from the lungs to the heart?',['Pulmonary vein','Pulmonary artery','Vena cava','Aorta'],'The pulmonary vein is the only vein carrying oxygenated blood. It returns blood from the lungs to the left atrium.',
     'Salur darah manakah membawa darah beroksigen dari peparu ke jantung?',['Vena pulmonari','Arteri pulmonari','Vena kava','Aorta'],'Vena pulmonari ialah satu-satunya vena yang membawa darah beroksigen. Ia membawa darah dari peparu ke atrium kiri.'),
   Q('What is the natural pacemaker of the heart?',['Sinoatrial (SA) node','Atrioventricular (AV) node','Bundle of His','Purkinje fibres'],'The SA node in the right atrium starts the electrical impulses that set the heartbeat.',
     'Apakah perentak semula jadi jantung?',['Nodus sinoatrium (SA)','Nodus atrioventrikel (AV)','Berkas His','Gentian Purkinje'],'Nodus SA di atrium kanan memulakan impuls elektrik yang menentukan degupan jantung.'),
   Q('Which cells produce antibodies?',['Lymphocytes','Erythrocytes','Platelets','Neutrophils only'],'Lymphocytes (B lymphocytes) make antibodies specific to an antigen.',
     'Sel manakah menghasilkan antibodi?',['Limfosit','Eritrosit','Platlet','Neutrofil sahaja'],'Limfosit (limfosit B) menghasilkan antibodi yang khusus untuk sesuatu antigen.'),
   Q('Vaccination gives which type of immunity?',['Artificial active immunity','Natural passive immunity','Artificial passive immunity','Natural active immunity'],'A vaccine stimulates the body to make its own antibodies and memory cells, so this is active immunity. It is artificial because it comes from an injection.',
     'Pemvaksinan memberikan keimunan jenis apa?',['Keimunan aktif buatan','Keimunan pasif semula jadi','Keimunan pasif buatan','Keimunan aktif semula jadi'],'Vaksin merangsang badan menghasilkan antibodi dan sel memori sendiri, jadi ia keimunan aktif. Ia buatan kerana diperoleh melalui suntikan.'),
   Q('An injection of antiserum against tetanus gives…',['Artificial passive immunity','Artificial active immunity','Natural active immunity','Natural passive immunity'],'Antiserum contains ready-made antibodies, so the body is protected straight away. It does not last, because no memory cells are made.',
     'Suntikan antiserum terhadap tetanus memberikan…',['Keimunan pasif buatan','Keimunan aktif buatan','Keimunan aktif semula jadi','Keimunan pasif semula jadi'],'Antiserum mengandungi antibodi siap sedia, jadi badan dilindungi serta-merta. Ia tidak kekal lama kerana tiada sel memori dihasilkan.'),
   Q('Which ABO blood group is called the universal donor?',['Group O','Group AB','Group A','Group B'],'Group O red blood cells have no A or B antigens, so they can be given to any ABO group.',
     'Kumpulan darah ABO manakah dikenali sebagai penderma universal?',['Kumpulan O','Kumpulan AB','Kumpulan A','Kumpulan B'],'Sel darah merah kumpulan O tidak mempunyai antigen A atau B, jadi ia boleh diberikan kepada semua kumpulan ABO.'),
   Q('Which vessels return excess tissue fluid to the bloodstream?',['Lymphatic vessels','Arteries','Capillaries of the lungs','Hepatic portal vein'],'Excess tissue fluid enters lymphatic capillaries as lymph and is returned to the blood through the subclavian veins.',
     'Salur manakah mengembalikan bendalir tisu berlebihan ke dalam aliran darah?',['Salur limfa','Arteri','Kapilari peparu','Vena portal hepar'],'Bendalir tisu berlebihan memasuki kapilari limfa sebagai limfa dan dikembalikan ke darah melalui vena subklavikel.')
  ]},
 {id:'nerve', form:4, icon:'⚡', name:['Nerve Spire','Menara Saraf'], topic:['Coordination, Response & Homeostasis','Koordinasi, Gerak Balas & Homeostasis'],
  minion:{name:['Static Bat','Kelawar Statik'], icon:'🦇'}, boss:{name:['The Rogue Hypothalamus','Hipotalamus Durjana'], icon:'🧠'},
  q:[
   Q('Which neurone carries impulses from a receptor to the central nervous system?',['Afferent (sensory) neurone','Efferent (motor) neurone','Interneurone','Effector neurone'],'Afferent neurones carry impulses from receptors to the CNS. Efferent neurones carry them from the CNS to effectors.',
     'Neuron manakah membawa impuls dari reseptor ke sistem saraf pusat?',['Neuron aferen (deria)','Neuron eferen (motor)','Neuron perantaraan','Neuron efektor'],'Neuron aferen membawa impuls dari reseptor ke sistem saraf pusat. Neuron eferen membawa impuls dari sistem saraf pusat ke efektor.'),
   Q('Which hormone lowers blood glucose level?',['Insulin','Glucagon','Adrenaline','ADH'],'Insulin from the β cells of the islets of Langerhans helps the liver turn excess glucose into glycogen.',
     'Hormon manakah menurunkan aras glukosa darah?',['Insulin','Glukagon','Adrenalina','ADH'],'Insulin daripada sel β pulau Langerhans membantu hati menukar glukosa berlebihan kepada glikogen.'),
   Q('In a withdrawal reflex arc, which neurone in the spinal cord connects the afferent and efferent neurones?',['Interneurone','Sensory neurone','Motor neurone','Receptor'],'The interneurone in the grey matter of the spinal cord passes the impulse from the afferent neurone to the efferent neurone.',
     'Dalam arka refleks tarik balik, neuron manakah dalam saraf tunjang menghubungkan neuron aferen dan neuron eferen?',['Neuron perantaraan','Neuron deria','Neuron motor','Reseptor'],'Neuron perantaraan dalam jirim kelabu saraf tunjang memindahkan impuls dari neuron aferen ke neuron eferen.'),
   Q('When the body is dehydrated, which hormone is secreted more?',['Antidiuretic hormone (ADH)','Insulin','Thyroxine','Oestrogen'],'The pituitary gland releases more ADH. The distal convoluted tubule and collecting duct become more permeable, so more water is reabsorbed and the urine is concentrated.',
     'Apabila badan mengalami dehidrasi, hormon manakah lebih banyak dirembeskan?',['Hormon antidiuresis (ADH)','Insulin','Tiroksina','Estrogen'],'Kelenjar pituitari merembeskan lebih banyak ADH. Tubul berlingkar distal dan duktus pengumpul menjadi lebih telap, jadi lebih banyak air diserap semula dan air kencing menjadi pekat.'),
   Q('Where in the nephron does ultrafiltration occur?',['Glomerulus into Bowman\'s capsule','Loop of Henle','Collecting duct','Distal convoluted tubule'],'High blood pressure in the glomerulus forces small molecules into Bowman\'s capsule. This is ultrafiltration.',
     'Di manakah ultraturasan berlaku dalam nefron?',['Glomerulus ke dalam kapsul Bowman','Gelung Henle','Duktus pengumpul','Tubul berlingkar distal'],'Tekanan darah yang tinggi dalam glomerulus memaksa molekul kecil masuk ke dalam kapsul Bowman. Ini ialah ultraturasan.'),
   Q('Which part of the brain regulates body temperature?',['Hypothalamus','Cerebellum','Medulla oblongata','Cerebrum'],'The hypothalamus is the body\'s thermostat. It detects changes in blood temperature and triggers corrective responses.',
     'Bahagian otak manakah mengawal suhu badan?',['Hipotalamus','Serebelum','Medula oblongata','Serebrum'],'Hipotalamus ialah termostat badan. Ia mengesan perubahan suhu darah dan mencetuskan tindak balas pembetulan.'),
   Q('On a hot day, the arterioles in the skin…',['dilate (vasodilation) so more heat is lost','constrict so less heat is lost','stop carrying blood','produce sweat'],'Vasodilation sends more blood near the skin surface, so more heat is lost by radiation.',
     'Pada hari yang panas, arteriol di kulit…',['mengembang (vasodilatasi) supaya lebih banyak haba hilang','mengecut supaya kurang haba hilang','berhenti membawa darah','menghasilkan peluh'],'Vasodilatasi membawa lebih banyak darah ke permukaan kulit, jadi lebih banyak haba hilang melalui sinaran.')
  ]},
 {id:'photo', form:5, icon:'🌿', name:['Photosynthesis Grove','Rimba Fotosintesis'], topic:['Plant Organisation, Nutrition, Transport & Response','Organisasi, Nutrisi, Pengangkutan & Gerak Balas Tumbuhan'],
  minion:{name:['Wilting Sprite','Pari-pari Layu'], icon:'🥀'}, boss:{name:['The Shadow Treant','Treant Bayang'], icon:'🌳'},
  q:[
   Q('Where does the light-dependent reaction of photosynthesis take place?',['Thylakoid membranes (grana)','Stroma','Cytoplasm','Mitochondria'],'Chlorophyll in the thylakoids (grana) absorbs light. Photolysis of water happens here, producing ATP and NADPH. The light-independent reaction happens in the stroma.',
     'Di manakah tindak balas bersandarkan cahaya dalam fotosintesis berlaku?',['Membran tilakoid (grana)','Stroma','Sitoplasma','Mitokondrion'],'Klorofil dalam tilakoid (grana) menyerap cahaya. Fotolisis air berlaku di sini, menghasilkan ATP dan NADPH. Tindak balas tak bersandarkan cahaya berlaku dalam stroma.'),
   Q('What does photolysis of water release as a by-product?',['Oxygen','Carbon dioxide','Glucose','Nitrogen'],'Light splits water into hydrogen ions, electrons and oxygen. The oxygen is released through the stomata.',
     'Apakah hasil sampingan yang dibebaskan semasa fotolisis air?',['Oksigen','Karbon dioksida','Glukosa','Nitrogen'],'Cahaya menguraikan air kepada ion hidrogen, elektron dan oksigen. Oksigen dibebaskan melalui stoma.'),
   Q('What does xylem transport?',['Water and mineral salts','Sucrose and amino acids','Hormones only','Oxygen only'],'Xylem vessels carry water and mineral salts up from the roots, driven by transpiration pull, cohesion and adhesion.',
     'Apakah yang diangkut oleh xilem?',['Air dan garam mineral','Sukrosa dan asid amino','Hormon sahaja','Oksigen sahaja'],'Salur xilem mengangkut air dan garam mineral dari akar ke atas, didorong oleh tarikan transpirasi, daya kohesi dan adhesi.'),
   Q('The transport of organic substances (e.g. sucrose) in phloem is called…',['translocation','transpiration','guttation','osmosis'],'Translocation moves sucrose through phloem sieve tubes from sources (leaves) to sinks (roots, fruits, growing points).',
     'Pengangkutan bahan organik (cth. sukrosa) dalam floem dipanggil…',['translokasi','transpirasi','gutasi','osmosis'],'Translokasi menggerakkan sukrosa melalui tiub tapis floem dari sumber (daun) ke sinki (akar, buah, titik tumbuh).'),
   Q('Stomata open when guard cells…',['become turgid','become flaccid','lose potassium ions','die'],'Guard cells take in K⁺ ions, so water enters by osmosis. They become turgid and curve outwards, opening the stoma.',
     'Stoma terbuka apabila sel pengawal…',['menjadi segah','menjadi flasid','kehilangan ion kalium','mati'],'Sel pengawal mengambil ion K⁺, jadi air meresap masuk secara osmosis. Sel pengawal menjadi segah dan melengkung ke luar, membuka stoma.'),
   Q('Which plant hormone causes shoots to bend towards light (phototropism)?',['Auxin','Ethylene','Abscisic acid','Gibberellin'],'Auxin builds up on the shaded side. Cells there elongate faster, so the shoot bends towards the light.',
     'Hormon tumbuhan manakah menyebabkan pucuk membengkok ke arah cahaya (fototropisme)?',['Auksin','Etilena','Asid absisik','Giberelin'],'Auksin terkumpul di bahagian yang terlindung. Sel di situ memanjang lebih cepat, jadi pucuk membengkok ke arah cahaya.'),
   Q('In double fertilisation, the endosperm nucleus is…',['triploid (3n)','haploid (n)','diploid (2n)','tetraploid (4n)'],'One male gamete fuses with the two polar nuclei to form the triploid endosperm. The other fuses with the egg cell to form a diploid zygote.',
     'Dalam persenyawaan ganda dua, nukleus endosperma ialah…',['triploid (3n)','haploid (n)','diploid (2n)','tetraploid (4n)'],'Satu gamet jantan bercantum dengan dua nukleus kutub untuk membentuk endosperma triploid. Satu lagi bercantum dengan sel telur membentuk zigot diploid.')
  ]},
 {id:'eco', form:5, icon:'🌏', name:['Ecosystem Plains','Dataran Ekosistem'], topic:['Biodiversity, Ecosystem & Environmental Sustainability','Biodiversiti, Ekosistem & Kelestarian Alam Sekitar'],
  minion:{name:['Invasive Beetle','Kumbang Invasif'], icon:'🪲'}, boss:{name:['The Smog Behemoth','Raksasa Jerebu'], icon:'🏭'},
  q:[
   Q('What are the producers in an ecosystem?',['Green plants (autotrophs)','Herbivores','Decomposers','Carnivores'],'Producers make their own food by photosynthesis. They are the first trophic level.',
     'Siapakah pengeluar dalam sesuatu ekosistem?',['Tumbuhan hijau (autotrof)','Herbivor','Pengurai','Karnivor'],'Pengeluar mensintesis makanan sendiri melalui fotosintesis. Mereka ialah aras trofik pertama.'),
   Q('A relationship where one organism benefits and the other is neither harmed nor helped is…',['commensalism','mutualism','parasitism','predation'],'Commensalism, e.g. remora fish and sharks, or epiphytes such as bird\'s nest fern on trees.',
     'Hubungan di mana satu organisma mendapat manfaat dan organisma lain tidak mendapat manfaat atau mudarat ialah…',['komensalisme','mutualisme','parasitisme','pemangsaan'],'Komensalisme, cth. ikan remora dan jerung, atau epifit seperti paku langsuyar pada pokok.'),
   Q('<i>Rhizobium</i> in the root nodules of legumes is an example of…',['mutualism','parasitism','commensalism','saprophytism'],'The bacteria fix nitrogen for the plant, and the plant gives the bacteria carbohydrates and shelter. Both benefit.',
     '<i>Rhizobium</i> dalam nodul akar tumbuhan kekacang ialah contoh…',['mutualisme','parasitisme','komensalisme','saprofitisme'],'Bakteria mengikat nitrogen untuk tumbuhan, dan tumbuhan memberi bakteria karbohidrat serta perlindungan. Kedua-duanya mendapat manfaat.'),
   Q('Which is the correct order of the classification hierarchy?',['Kingdom, Phylum, Class, Order, Family, Genus, Species','Kingdom, Class, Phylum, Order, Family, Genus, Species','Phylum, Kingdom, Class, Order, Genus, Family, Species','Species, Genus, Order, Family, Class, Phylum, Kingdom'],'From broadest to most specific: Kingdom → Phylum → Class → Order → Family → Genus → Species.',
     'Manakah urutan hierarki pengelasan yang betul?',['Alam, Filum, Kelas, Order, Famili, Genus, Spesies','Alam, Kelas, Filum, Order, Famili, Genus, Spesies','Filum, Alam, Kelas, Order, Genus, Famili, Spesies','Spesies, Genus, Order, Famili, Kelas, Filum, Alam'],'Dari yang paling umum ke paling khusus: Alam → Filum → Kelas → Order → Famili → Genus → Spesies.'),
   Q('Which scientific name follows binomial nomenclature correctly?',['<i>Homo sapiens</i>','<i>homo sapiens</i>','<i>Homo Sapiens</i>','<i>HOMO sapiens</i>'],'The genus starts with a capital letter and the species is all lowercase. The name is italicised, or underlined when handwritten.',
     'Nama saintifik manakah mengikut sistem penamaan binomial dengan betul?',['<i>Homo sapiens</i>','<i>homo sapiens</i>','<i>Homo Sapiens</i>','<i>HOMO sapiens</i>'],'Genus bermula dengan huruf besar dan spesies ditulis dengan huruf kecil sepenuhnya. Nama dicondongkan, atau digaris bawah jika ditulis tangan.'),
   Q('Eutrophication in a lake is caused mainly by…',['excess nitrates and phosphates from fertilisers','too much dissolved oxygen','an increase in fish population','acid rain only'],'Nutrients cause an algal bloom. Bacteria decompose the dead algae, which raises the BOD and lowers dissolved oxygen, so aquatic life dies.',
     'Eutrofikasi di tasik disebabkan terutamanya oleh…',['nitrat dan fosfat berlebihan daripada baja','oksigen terlarut yang terlalu banyak','pertambahan populasi ikan','hujan asid sahaja'],'Nutrien menyebabkan ledakan alga. Bakteria mengurai alga yang mati, meningkatkan BOD dan mengurangkan oksigen terlarut, lalu hidupan akuatik mati.'),
   Q('Which gas is a major contributor to the greenhouse effect?',['Carbon dioxide','Oxygen','Nitrogen','Argon'],'CO₂ (with methane and CFCs) traps heat in the atmosphere, causing global warming.',
     'Gas manakah penyumbang utama kepada kesan rumah hijau?',['Karbon dioksida','Oksigen','Nitrogen','Argon'],'CO₂ (bersama metana dan CFC) memerangkap haba dalam atmosfera, menyebabkan pemanasan global.')
  ]},
 {id:'genetic', form:5, icon:'🐉', name:['Genetic Crypt','Makam Genetik'], topic:['Inheritance, Variation & Genetic Technology','Pewarisan, Variasi & Teknologi Genetik'],
  minion:{name:['Mutant Allele','Alel Mutan'], icon:'🧬'}, boss:{name:['The Recessive Dragon','Naga Resesif'], icon:'🐉'},
  q:[
   Q('Tall (T) is dominant over dwarf (t). In the cross Tt × Tt, what fraction of offspring are tall?',['3/4','1/2','1/4','All of them'],'Offspring: TT, Tt, Tt, tt. Three of the four have at least one T, giving a 3 tall : 1 dwarf phenotypic ratio.',
     'Tinggi (T) dominan terhadap kerdil (t). Dalam kacukan Tt × Tt, berapakah pecahan anak yang tinggi?',['3/4','1/2','1/4','Semuanya'],'Anak: TT, Tt, Tt, tt. Tiga daripada empat mempunyai sekurang-kurangnya satu T, memberi nisbah fenotip 3 tinggi : 1 kerdil.'),
   Q('What is the F2 phenotypic ratio of a dihybrid cross?',['9 : 3 : 3 : 1','3 : 1','1 : 2 : 1','1 : 1 : 1 : 1'],'Crossing two heterozygous parents (e.g. RrYy × RrYy) gives 9:3:3:1, as Mendel showed with pea plants.',
     'Apakah nisbah fenotip F2 bagi kacukan dihibrid?',['9 : 3 : 3 : 1','3 : 1','1 : 2 : 1','1 : 1 : 1 : 1'],'Kacukan dua induk heterozigot (cth. RrYy × RrYy) menghasilkan 9:3:3:1, seperti yang ditunjukkan oleh Mendel dengan pokok kacang pea.'),
   Q('Haemophilia is a…',['sex-linked recessive disorder carried on the X chromosome','dominant disorder on chromosome 21','disorder caused by an extra chromosome','disorder carried on the Y chromosome'],'The haemophilia allele is recessive and on the X chromosome, so males (XY) are affected more often than females.',
     'Hemofilia ialah…',['penyakit resesif rangkai seks yang dibawa pada kromosom X','penyakit dominan pada kromosom 21','penyakit akibat kromosom tambahan','penyakit yang dibawa pada kromosom Y'],'Alel hemofilia adalah resesif dan terletak pada kromosom X, jadi lelaki (XY) lebih kerap terjejas berbanding perempuan.'),
   Q('Which of these shows discontinuous variation?',['ABO blood group','Height','Body mass','Skin colour'],'Discontinuous variation falls into distinct groups with no intermediates. Height, body mass and skin colour vary continuously.',
     'Manakah antara berikut menunjukkan variasi tak selanjar?',['Kumpulan darah ABO','Ketinggian','Jisim badan','Warna kulit'],'Variasi tak selanjar terbahagi kepada kumpulan yang jelas tanpa perantaraan. Ketinggian, jisim badan dan warna kulit berubah secara selanjar.'),
   Q('Which enzyme cuts DNA at specific sequences in genetic engineering?',['Restriction enzyme','DNA ligase','Amylase','DNA polymerase'],'Restriction enzymes cut DNA at specific base sequences. DNA ligase then joins the gene into the plasmid vector.',

// ======================= MONSTER ART (custom SVG, real-world inspired) =======================
const EY = (x1,x2,y,r=6,mood='angry',iris='#111') => {
  let s = `<circle cx="${x1}" cy="${y}" r="${r}" fill="#fff" stroke="#111" stroke-width="1.5"/><circle cx="${x2}" cy="${y}" r="${r}" fill="#fff" stroke="#111" stroke-width="1.5"/>`
        + `<circle cx="${x1+r*.2}" cy="${y+r*.15}" r="${r*.52}" fill="${iris}"/><circle cx="${x2-r*.2}" cy="${y+r*.15}" r="${r*.52}" fill="${iris}"/>`
        + `<circle cx="${x1+r*.35}" cy="${y-r*.1}" r="${r*.16}" fill="#fff"/><circle cx="${x2-r*.05}" cy="${y-r*.1}" r="${r*.16}" fill="#fff"/>`;
  if(mood==='angry') s += `<path d="M${x1-r-1} ${y-r-5} L${x1+r} ${y-r} M${x2+r+1} ${y-r-5} L${x2-r} ${y-r}" stroke="#111" stroke-width="3" stroke-linecap="round"/>`;
  if(mood==='sad')   s += `<path d="M${x1-r} ${y-r} L${x1+r} ${y-r-4} M${x2+r} ${y-r} L${x2-r} ${y-r-4}" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
  return s;
};
const FM = (cx,y,w) => `<path d="M${cx-w} ${y} Q${cx} ${y+w*1.1} ${cx+w} ${y} Z" fill="#3a0d14" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>`
  + `<path d="M${cx-w*.75} ${y+.5} l2.6 5 l2.6 -5 Z M${cx+w*.75-5.2} ${y+.5} l2.6 5 l2.6 -5 Z" fill="#fff"/>`;
const FR = (cx,y,w) => `<path d="M${cx-w} ${y+4} Q${cx} ${y-4} ${cx+w} ${y+4}" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>`;
const SMILE = (cx,y,w,c='#111') => `<path d="M${cx-w} ${y} Q${cx} ${y+w*.9} ${cx+w} ${y}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
const DROP = (x,y,c='#5aa8e8',s=1) => `<path d="M${x} ${y} q${4*s} ${6*s} 0 ${9*s} q${-4*s} ${-3*s} 0 ${-9*s} Z" fill="${c}"/>`;
const STAR = (x,y,r,c='#fff3c4') => `<path d="M${x} ${y-r} L${x+r*.3} ${y-r*.3} L${x+r} ${y} L${x+r*.3} ${y+r*.3} L${x} ${y+r} L${x-r*.3} ${y+r*.3} L${x-r} ${y} L${x-r*.3} ${y-r*.3} Z" fill="${c}"/>`;
const THERMO = (x,y) => `<rect x="${x}" y="${y}" width="9" height="34" rx="4.5" fill="#fff" stroke="#444" stroke-width="2"/><rect x="${x+2.5}" y="${y+8}" width="4" height="26" fill="#e33"/><circle cx="${x+4.5}" cy="${y+37}" r="7" fill="#e33" stroke="#444" stroke-width="2"/>`;
const spikes = (cx,cy,r1,r2,n,col,knob) => { let s=''; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, c=Math.cos(a), d=Math.sin(a);
  s += `<line x1="${(cx+c*r1).toFixed(1)}" y1="${(cy+d*r1).toFixed(1)}" x2="${(cx+c*r2).toFixed(1)}" y2="${(cy+d*r2).toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><circle cx="${(cx+c*(r2+2)).toFixed(1)}" cy="${(cy+d*(r2+2)).toFixed(1)}" r="3.6" fill="${knob}" stroke="${col}" stroke-width="1.5"/>`; } return s; };
const XCHR = (x,y,s,c) => `<g stroke="${c}" stroke-width="${3*s}" stroke-linecap="round"><line x1="${x-4*s}" y1="${y-5*s}" x2="${x+4*s}" y2="${y+5*s}"/><line x1="${x+4*s}" y1="${y-5*s}" x2="${x-4*s}" y2="${y+5*s}"/></g>`;

// ======================= STATE =======================
const KEY = 'bioDungeonSave_v1', IMPORT_KEY = 'bioDungeonImports';
let S = load();
if(S && !S.zs) S.zs = {};
let B = null;            // battle state
let SCREEN = null;       // function that re-renders the current screen
const app = document.getElementById('app');

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} queueSync(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function clsOf(id){ return CLASSES.find(c=>c.id===id) || CLASSES[0]; }
function cls(){ return clsOf(S.cls); }
function zone(id){ return ZONES.find(z=>z.id===id); }
function bonusIn(zid){ return cls().zones.includes(zid); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.innerHTML=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2500); }
function pct(a,b){ return Math.max(0,Math.min(100, b? a/b*100 : 0)); }
function qd(z,qi){ return z.q[qi][LANG==='bm'?'bm':'en']; } // [question, options, explanation]
function show(fn){ if(fn!==dashScreen) stopDash(); SCREEN=fn; fn(); window.scrollTo(0,0); }

function renderLangBar(){
  document.getElementById('langbar').innerHTML =
    `<button class="${LANG==='bm'?'on':''}" onclick="setLang('bm')">BM</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button>`;
  document.documentElement.lang = LANG==='bm' ? 'ms' : 'en';
}
function setLang(l){
  LANG = l; try{ localStorage.setItem('bioLang', l); }catch(e){}
  renderLangBar(); if(SCREEN) SCREEN();
}

function titleScreen(){

function classScreen(){

        ${CLASSES.map(c=>`

function startGame(){

  S = {name, cls:c.id, level:1, xp:0, maxHp:c.hp, hp:c.hp, notes:c.notes, potions:2, cleared:[], wrong:{}, zs:{}, correct:0, total:0, unlockAll:false};

  return `<div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><h3>${c.icon} ${esc(S.name)}</h3><span class="muted" style="font-size:13px">${t('level')} ${S.level} ${L(c.name)}</span></div>

function isOpen(i){ return S.unlockAll || i===0 || S.cleared.includes(ZONES[i-1].id); }

    ? `<div class="note row" style="justify-content:space-between"><span>🏫 ${t('inClass')}: <b>${esc(S.room||'')}</b> · PIN ${fmtPin(S.pin)}</span><button class="btn ghost small" onclick="leaveClass()">${t('leave')}</button></div>
       <button class="btn block" onclick="dashCtx=null;show(dashScreen)">${t('classBtn')}</button>`
    : `<div class="note">${t('soloNote')}</div><button class="btn ghost block" onclick="show(joinScreen)">${t('joinBtnShort')}</button>`;

      <button class="btn ghost block" onclick="show(journalScreen)">${t('journalBtn', Object.keys(S.wrong).length)}</button>
      <div class="row" style="justify-content:space-between;margin-top:12px">
        ${teacherOK===true ? `<label class="toggle"><input type="checkbox" ${S.unlockAll?'checked':''} onchange="S.unlockAll=this.checked;save();mapScreen()"> ${t('teacherMode')}</label>` : '<span></span>'}
        <button class="btn ghost small" onclick="confirmReset()">${t('reset')}</button>
      </div>
      <div id="rstBox"></div>
    </div>`;

function confirmReset(){
  document.getElementById('rstBox').innerHTML = `<div class="note" style="border-color:var(--bad);margin:12px 0 0">

    <button class="btn ghost small" onclick="document.getElementById('rstBox').innerHTML=''">${t('cancel')}</button></div></div>`;
}
function doReset(){ S=null; try{ localStorage.removeItem(KEY); }catch(e){} show(titleScreen); }

function journalScreen(){
  const items = Object.values(S.wrong).map(w=>{
    const z = zone(w.z); if(!z || !z.q[w.qi]) return '';
    const [q,o,e] = qd(z,w.qi);

    <button class="btn ghost" onclick="show(mapScreen)">${t('backMap')}</button>`;

// ======================= BATTLE =======================
function startZone(zid){
  const z = zone(zid);
  S.hp = S.maxHp; save(); // rest at camp before each zone
  // three DIFFERENT minions in random order, then the boss
  const types = shuffle([{name:z.minion.name, art:z.id+'_m'}, ...EXTRA_MINIONS[z.id]]);
  const minions = types.map(m=>({kind:'minion', name:m.name, art:m.art, hp:12, max:12, dmg:6}));
  B = { z, idx:0,
    foes:[ ...minions, {kind:'boss', name:z.boss.name, art:z.id+'_b', hp:34, max:34, dmg:9, boss:true} ],
    pool: shuffle(z.q.map((_,i)=>i)) };
  askQuestion();
  show(renderBattle);
}
function foe(){ return B.foes[B.idx]; }
function fname(f){ return L(f.name || B.z[f.kind].name); }

function askQuestion(){
  if(!B.pool.length) B.pool = shuffle(B.z.q.map((_,i)=>i));
  B.qi = B.pool.pop();
  // the correct answer (option 0) never sits in the same position as the last time this question was shown
  const key = B.z.id+':'+B.qi; S.lastPos = S.lastPos || {};
  const prev = S.lastPos[key];
  do { B.order = shuffle([0,1,2,3]); } while (B.order.indexOf(0) === prev);
  S.lastPos[key] = B.order.indexOf(0);
  B.removed = []; B.answered = false; B.noted = false; B.last = null;
}

function resultMsg(r){
  const f = foe();
  if(r.ok) return (r.kind==='crit'?t('crit',r.dmg):r.kind==='glance'?t('glance',r.dmg):t('hit',r.dmg)) + ` <span class="muted">${t('xp10')}</span>`;
  return r.kind==='dodge' ? t('dodge', fname(f), r.total) : t('hurt', fname(f), r.total, r.dmg);
}

function renderBattle(animate=false){
  const z = B.z, f = foe(), [q,o,e] = qd(z,B.qi), r = B.last;
  const optCls = i => !B.answered ? (B.removed.includes(i)?'gone':'') : (i===0?'right': (r && i===r.i ? 'wrong' : (B.removed.includes(i)?'gone':'')));
  const rollLabel = r ? (r.ok ? t('atkRoll') + (r.bonus?t('bonusDmg'):'') : t('dodgeRoll') + (r.bonus?t('bonus3'):'') + t('need14')) : '';
  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="muted">${z.icon} <b style="color:var(--text)">${L(z.name)}</b></span>
      <button class="btn ghost small" onclick="show(mapScreen)">${t('flee')}</button>
    </div>
    <div class="panel enemy">
      <div class="foes">${B.foes.map((x,i)=>`<span class="${i===B.idx?'now':''} ${i<B.idx?'down':''}">${x.boss?'👑':i+1}</span>`).join('')}</div>
      ${f.boss?`<span class="boss-tag">${t('boss')}</span>`:''}
      <div><span class="face ${r && !animate && r.ok ? (f.hp<=0?'dead':'') : ''}" id="face">${monSvg(f.art,130)}</span></div>
      <h3>${fname(f)}</h3>
      <div class="ref">🔬 ${t('refLbl')}: ${L(MON[f.art].ref)}</div>
      <div class="stat" style="max-width:300px;margin:6px auto 3px"><span>HP</span><span>${Math.max(0,f.hp)}/${f.max}</span></div>
      <div class="bar ehp" style="max-width:300px;margin:0 auto"><i style="width:${pct(animate&&r&&r.ok?f.hp+r.dmg:f.hp,f.max)}%"></i></div>
    </div>
    <div class="panel">
      <div class="stat"><span>❤️ ${esc(S.name)} · ${t('lv')} ${S.level}</span><span>${S.hp}/${S.maxHp}</span></div>
      <div class="bar hpbar" style="margin-bottom:14px"><i id="php" style="width:${pct(animate&&r&&!r.ok&&r.kind==='hurt'?S.hp+r.dmg:S.hp,S.maxHp)}%"></i></div>
      <div class="q">${q}</div>
      <div class="opts">${B.order.map(i=>`<button class="opt ${optCls(i)}" ${B.answered||B.removed.includes(i)?'disabled':''} onclick="answer(${i})">${o[i]}</button>`).join('')}</div>
      ${B.answered ? '' : `<div class="row" style="margin-top:12px">
        <button class="btn ghost small" ${S.notes<1||B.noted?'disabled':''} onclick="useNotes()">📜 ${t('notes')} (${S.notes})</button>
        <button class="btn ghost small" ${S.potions<1||S.hp>=S.maxHp?'disabled':''} onclick="usePotion()">${t('potionBtn')} (${S.potions})</button>
      </div>`}
      ${r ? `<div class="result">
        <div class="dice"><div class="d20 ${animate?'roll':r.cls}" id="die">${animate?'?':r.r}</div>
          <div><div class="muted" style="font-size:13px">${rollLabel}</div><div id="rmsg" class="${animate?'muted':''}">${animate?t('rolling'):resultMsg(r)}</div></div></div>
        <div class="expl">${r.ok?'':`<b>${t('answer')}</b> ${o[0]}<br>`}${e}</div>
        <button class="btn block" id="cont" style="margin-top:14px;${animate?'visibility:hidden':''}" onclick="afterTurn()">${t('next')}</button>
      </div>` : ''}
    </div>`;
  if(animate) runDice();
}

function runDice(){
  const r = B.last, f = foe(), die = document.getElementById('die');
  let n = 0;
  const spin = setInterval(()=>{
    if(!document.getElementById('die')){ clearInterval(spin); return; }
    die.textContent = 1+Math.floor(Math.random()*20);
    if(++n>8){
      clearInterval(spin);
      die.textContent = r.r; if(r.cls) die.classList.add(r.cls);
      const m = document.getElementById('rmsg'); m.innerHTML = resultMsg(r); m.classList.remove('muted');
      document.getElementById('cont').style.visibility = 'visible';
      if(r.ok){ document.getElementById('face').classList.add(f.hp<=0?'dead':'hit'); document.querySelector('.ehp>i').style.width = pct(f.hp,f.max)+'%'; }
      document.getElementById('php').style.width = pct(S.hp,S.maxHp)+'%';
    }
  }, 65);
}

function useNotes(){
  if(S.notes<1 || B.noted) return;
  B.removed = shuffle([1,2,3]).slice(0,2); B.noted = true; S.notes--; save();
  renderBattle();
}
function usePotion(){
  if(S.potions<1) return;
  S.potions--; S.hp = Math.min(S.maxHp, S.hp+15); save();
  toast('🧪 +15 HP'); renderBattle();
}

function answer(i){
  if(B.answered) return;
  B.answered = true;
  const z = B.z, f = foe(), ok = i===0;
  const key = z.id+':'+B.qi;
  S.total++;
  const zs = S.zs[z.id] || (S.zs[z.id] = [0,0]); zs[1]++;
  if(ok){ S.correct++; zs[0]++; S.xp += 10; delete S.wrong[key]; } else { S.wrong[key] = {z:z.id, qi:B.qi}; }
  const bonus = bonusIn(z.id) ? 3 : 0;
  const r = 1 + Math.floor(Math.random()*20);
  const res = {i, ok, r, bonus, cls:''};
  if(ok){
    let dmg = 4 + Math.ceil(r/2) + bonus + (S.level-1);
    if(r===20){ dmg*=2; res.kind='crit'; res.cls='crit'; }
    else if(r===1){ dmg=Math.ceil(dmg/2); res.kind='glance'; res.cls='fail'; }
    else res.kind='hit';
    res.dmg = dmg; f.hp -= dmg;
  } else {
    res.total = r + bonus;
    if(r===20 || res.total>=14){ res.kind='dodge'; res.cls = r===20?'crit':''; }
    else { res.kind='hurt'; res.dmg=f.dmg; S.hp -= f.dmg; res.cls = r===1?'fail':''; }
  }

  save();
  renderBattle(true);
}

function levelCheck(){
  while(S.xp>=100){ S.xp-=100; S.level++; S.maxHp+=5; S.hp=Math.min(S.maxHp,S.hp+5); toast(t('levelUp',S.level)); }
}

function afterTurn(){
  const f = foe();
  if(S.hp<=0){ S.hp=0; save(); return show(defeatScreen); }
  if(f.hp<=0){
    S.xp += f.boss?60:20;
    let loot = [];
    if(f.boss){ S.potions++; S.notes++; loot=['potion','note']; }
    else if(Math.random()<0.35){ if(Math.random()<0.5){S.potions++;loot=['potion'];} else {S.notes++;loot=['note'];} }
    levelCheck();
    if(f.boss){ if(!S.cleared.includes(B.z.id)) S.cleared.push(B.z.id); save(); B.loot = loot; return show(clearedScreen); }
    save();
    toast(`${monSvg(f.art,28)} ${t('defeated')}${loot.length?' · '+t('loot')+': '+loot.map(x=>t(x)).join(', '):''}`);
    B.idx++;
    if(foe().boss) setTimeout(()=>toast(t('appears', fname(foe()))), 900);
  } else { levelCheck(); save(); }
  askQuestion();
  renderBattle();
}

async function doSync(){
  if(!S || !S.pin) return;

  const body = record(), sig = S.pin + JSON.stringify(body);

          <div class="bar zbar"><i style="width:${pct(az,ZONES.length)}%"></i></div>
          <div class="stat"><span>🎯 ${t('avgAcc')}</span><span>${ga===null?'–':ga+'%'}</span></div>
          <div class="bar ${ga===null?'':accClass(ga)}"><i style="width:${ga??0}%"></i></div>
          <div class="stat" style="margin-top:8px"><span>⭐ ${t('avgLv')}</span><span>${k?al.toFixed(1):'–'}</span></div>
          <div class="muted" style="font-size:12px;margin-top:4px">${t('bonusZ')}: ${c.zones.map(id=>zone(id).icon).join(' ')}</div>
        </div>`; }).join('')}</div>
    </div>`;
  app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h2>${meta && meta.title ? esc(String(meta.title).slice(0,40)) : t('dTitle')}</h2>
      <button class="btn ghost small" onclick="${host?'dashCtx=null;show(hostScreen)':'show(S?mapScreen:titleScreen)'}">${t('back')}</button>
    </div>
    ${banner}${hostCtl}${status}
    ${leaderboard}
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><small>${t('students')}</small><b>${n}</b></div>
      <div class="kpi"><small>${t('avgAcc')}</small><b>${totT?Math.round(totC/totT*100):0}%</b></div>
      <div class="kpi"><small>${t('avgZones')}</small><b>${avgZ}</b></div>
      <div class="kpi"><small>${t('answered')}</small><b>${totT}</b></div>
    </div>
    <div class="panel">
      <h3>${t('topicTitle')}</h3>
      <p class="muted" style="font-size:13px;margin:4px 0 8px">${t('topicHint')}</p>
      ${topics.map(x=>`<div class="trow"><span>${x.z.icon} ${L(x.z.name)}</span>
        <div class="bar ${x.a===null?'':accClass(x.a)}"><i style="width:${x.a??0}%"></i></div>
        <span class="v">${x.a===null?t('noTry'):x.a+'% · '+x.tt}</span></div>`).join('')}
    </div>
    ${classPanel}
    <div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h3>${t('students')} (${n})</h3>
        <div class="row" style="gap:6px"><span class="muted" style="font-size:13px">${t('sort')}</span>${sortBtn('points','sPts')}${sortBtn('acc','sAcc')}${sortBtn('recent','sRecent')}${sortBtn('name','sName')}</div>
      </div>
      ${sorted.length ? sorted.map(card).join('') : `<p class="muted center">${t('empty')}</p>`}
    </div>`;
}

renderLangBar();
// Teacher tools are not linked from the main page: open the game link with #teacher at the end
const route = () => { if(location.hash === '#teacher') show(hostScreen); };
window.addEventListener('hashchange', route);
show(location.hash === '#teacher' ? hostScreen : titleScreen);
// "Unlock all zones" is a teacher-only switch: show it only on a device verified with the teacher passcode
if(FB_READY) checkTeacher().then(ok=>{
  if(!ok && S && S.unlockAll){ S.unlockAll = false; save(); }
  if(SCREEN===mapScreen) mapScreen();
});
if(S && S.pin) queueSync();

</script>
</body>
</html>
